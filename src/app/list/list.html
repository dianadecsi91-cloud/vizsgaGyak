



<table  class="table table-bordered">
  <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">NAME</th>
      <th scope="col">JOB</th>
      <th scope="col">AGE</th>
      <th scope="col">SALARY</th>
      <th scope="col">EXTRA</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of service.developers; let i=index">
      <td>{{item.getShortId()}}</td>
      <td>{{item.name}} <img src="{{item.image}}" height="40" class="rounded-circle"> </td>
      <td>{{item.job}}</td>
      <td>{{item.age}}</td>
      <td>{{item.getFormattedSalary()}}</td>
      <td><button (click)="delete2(i)" type="button" class="btn btn-danger">Törlés</button></td>
    </tr>
    
  </tbody>
</table>
