



<table  class="table table-bordered">
  <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">NAME</th>
      <th scope="col">JOB</th>
      <th scope="col">AGE</th>
      <th scope="col">SALARY</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of service.developers">
      <td>{{item.id}}</td>
      <td>{{item.name}}</td>
      <td>{{item.job}}</td>
      <td>{{item.age}}</td>
      <td>{{item.salary}}</td>
    </tr>
    
  </tbody>
</table>
